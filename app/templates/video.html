<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Player</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/video.css?v={{ version }}">
    <link href="//vjs.zencdn.net/8.3.0/video-js.min.css" rel="stylesheet">
    <script src="//vjs.zencdn.net/8.3.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="page-video legacy-video-page">
    <div class="top-bar">
        <div class="back">
            <a href="{{ url_for('main.home') }}">Back</a>
            <span id="videoCount" class="video-count"></span>
        </div>
        {% if directory != "10" %}
        <div class="prev"><a href="#" id="prevButton">Prev</a></div>
        <div class="loop"><a href="#" id="loopbutton">Loop</a></div>
        {% endif %}
        <div class="like-bar{% if directory != '10' %} with-prev-loop{% endif %}">
            <select id="likeFilterSelect">
                <option value="unliked">Unliked</option>
                <option value="liked">Liked</option>
            </select>
        </div>
        {#<div class="logout">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% endif %}
        </div>#}
    </div>
    <div class="heart-btn-wrap{% if directory != '10' %} with-prev-loop{% endif %}">
        <button type="button" id="heartButton" class="heart-btn" aria-label="Like">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path class="heart-shape" d="M12 21s-6.716-4.35-9.428-8.114C.774 10.29 1.2 6.6 4.2 4.8c2.4-1.44 5.1-.6 6.9 1.5 1.8-2.1 4.5-2.94 6.9-1.5 3 1.8 3.426 5.49 1.628 8.086C18.716 16.65 12 21 12 21z"/>
            </svg>
        </button>
    </div>
    <div id="videoContainer">
        <div id="video-filename"></div>

        <!--<div id="controls-repit">
            <button id="aButton">A</button>
            <button id="bButton">B</button>
        </div>-->



        <div id="controls">
            {% if directory != "10" %}
            <div id="controls-stack">
                <div id="controls-sync">
                    <button id="syncPlusBigBtn">+0.1</button>
                    <button id="syncPlusBtn">+</button>
                    <button id="syncMinusBtn">-</button>
                    <button id="syncMinusBigBtn">-0.1</button>
                    <button id="syncResetBtn">Reset</button>
                </div>
                <div id="controls-top">
                    <button id="minusTenSec">-30</button>
                    <button id="plusTenSec">+30</button>
                    <button id="toggleGain">Gain</button>
                    <button id="fullScreen">Full</button>
                </div>
            </div>
            <button id="aButton">A</button>
            <button id="bButton">B</button>
            {% endif %}
            <button id="deleteButton">Delete</button>
                <button id="nextButton">Next</button>
        </div>

        {#<video id="videoPlayer" controls autoplay preload="auto">
            <source src="" type="video/mp4" id="videoSource">
        </video>#}
        {#<video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto">
            <source src="" type="video/mp4">
        </video>#}
    </div>
    <div id="sync-message"></div>
    <div id="volume-message"></div>

    <script>
        const dir = "{{ directory }}";
    </script>
    <script src="/static/js/video.js?v={{ version }}"></script>
</body>
</html>
